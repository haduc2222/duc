#!name=Ha Trung Duc
#!desc=Hatrungduc - Shadowrocket rules
#!author=Ha Trung Duc

[Rule]
# Block selected UDP video/ad traffic
AND,((DOMAIN-SUFFIX,googlevideo.com),(PROTOCOL,UDP)),REJECT
AND,((DOMAIN,youtubei.googleapis.com),(PROTOCOL,UDP)),REJECT

# Basic inbound firewall rules
AND,((PROTOCOL,TCP),(DEST-PORT,445)),REJECT-DROP
AND,((PROTOCOL,TCP),(DEST-PORT,135-139)),REJECT-DROP
AND,((PROTOCOL,TCP),(DEST-PORT,23)),REJECT-DROP
AND,((PROTOCOL,UDP),(DEST-PORT,1900)),REJECT-DROP

# Selected telemetry and tracking domains
DOMAIN,metrics.icloud.com,REJECT
DOMAIN,logs.apple.com,REJECT
DOMAIN,analytics.google.com,REJECT
DOMAIN-KEYWORD,telemetry,REJECT
DOMAIN-KEYWORD,tracking,REJECT

# Direct routes for common video CDNs
DOMAIN-SUFFIX,googlevideo.com,DIRECT
DOMAIN-SUFFIX,nflxvideo.net,DIRECT
DOMAIN-KEYWORD,tiktokcdn,DIRECT
DOMAIN-KEYWORD,fbcdn,DIRECT
DOMAIN-KEYWORD,vcdn,DIRECT
DOMAIN-KEYWORD,akamaihd,DIRECT

# Selected ad and analytics domains
DOMAIN-SUFFIX,admob.com,REJECT
DOMAIN-SUFFIX,googlesyndication.com,REJECT
DOMAIN-SUFFIX,doubleclick.net,REJECT
DOMAIN-SUFFIX,googleadservices.com,REJECT
DOMAIN-SUFFIX,applovin.com,REJECT
DOMAIN-SUFFIX,applvn.com,REJECT
DOMAIN-SUFFIX,unityads.unity3d.com,REJECT
DOMAIN-SUFFIX,vungle.com,REJECT
DOMAIN-SUFFIX,ironsrc.com,REJECT
DOMAIN-SUFFIX,chartboost.com,REJECT
DOMAIN-SUFFIX,adcolony.com,REJECT
DOMAIN-SUFFIX,inmobi.com,REJECT
DOMAIN-SUFFIX,appsflyer.com,REJECT
DOMAIN-SUFFIX,adjust.com,REJECT
DOMAIN-SUFFIX,rayjump.com,REJECT
DOMAIN-SUFFIX,criteo.com,REJECT
DOMAIN-KEYWORD,adsystem,REJECT

# Vietnam traffic direct; remaining traffic through proxy
GEOIP,VN,DIRECT
FINAL,PROXY

[Header Rewrite]
# Remove cached RevenueCat ETag headers
^https?://api\.revenuecat\.com/.+/(receipts$|subscribers/?(.*?)*$) header-del x-revenuecat-etag
^https?://api\.revenuecat\.com/.+/(receipts$|subscribers/?(.*?)*$) header-del X-RevenueCat-ETag
# Spotify customization request
http-request ^https:\/\/(spclient\.wg\.spotify\.com|.*-spclient\.spotify\.com(:443)?)\/user-customization-service\/v1\/customize$ header-del if-none-match

[URL Rewrite]
# YouTube and Google video ad request filters
^https?:\/\/[\w-]+\.googlevideo\.com\/(?!(dclk_video_ads|videoplayback\?)).+&oad reject-200
^https?:\/\/(www|s)\.youtube\.com\/api\/stats\/ads reject-200
^https?:\/\/(www|s)\.youtube\.com\/(pagead|ptracking) reject-200
^https?:\/\/s\.youtube\.com\/api\/stats\/qoe\?adcontext reject-200
(^https?:\/\/[\w-]+\.googlevideo\.com\/(?!dclk_video_ads).+?)&ctier=L(&.+?),ctier,(.+) $1$2$3 302

[MITM]
hostname = %APPEND%, *.googlevideo.com, -redirector*.googlevideo.com, youtubei.googleapis.com, www.youtube.com, s.youtube.com, spclient.wg.spotify.com
